  changelog2:
    runs-on: ubuntu-latest
    name: "📜 Changelog"
    outputs:
      changelog: ${{ steps.changelog.outputs.changes }}
    steps:
      - name: "🔁 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "✍️ Write changelog"
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.github_token }}
          tag: ${{ github.ref_name }}
          writeToFile: false
          
